[project]
name = "filedrop-aws"
version = "0.1.0"
description = "Serverless file-delivery platform on AWS: S3 presigned uploads, EventBridge, SNS/SQS fan-out, SES delivery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kunal Kejriwal" }]

dependencies = [
    "aws-lambda-powertools[tracer]>=3.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "aws-cdk-lib>=2.140.0",
    "constructs>=10.3.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "moto[s3,dynamodb,sqs,sns,ses]>=5.0.0",
    "boto3-stubs[s3,dynamodb,sqs,sns,ses,lambda]>=1.34.0",
    "types-requests",
    "requests>=2.32.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
# Each function dir has its own handler.py. Adding "functions" to mypy_path
# (plus an __init__.py in each function dir) lets mypy resolve them as
# audit.handler / notify.handler / etc — distinct modules, no collision.
mypy_path = "functions"
explicit_package_bases = true
namespace_packages = true
exclude = ["cdk.out", ".venv", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: hits deployed API (skipped unless FILEDROP_API_URL is set)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
