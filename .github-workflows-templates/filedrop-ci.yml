# Filedrop CI — lint / typecheck / unit tests / cdk synth.
# Copy this to .github/workflows/filedrop-ci.yml at the repo root.
name: filedrop-ci

on:
  pull_request:
    paths:
      - "filedrop-aws/**"
      - ".github/workflows/filedrop-ci.yml"
  push:
    branches: [main]
    paths:
      - "filedrop-aws/**"
      - ".github/workflows/filedrop-ci.yml"

defaults:
  run:
    working-directory: filedrop-aws

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy shared functions infra

      - name: Pytest (unit)
        run: uv run pytest tests/unit -v

      - name: Set up Node (for CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: cdk synth (no deploy)
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: "ap-south-1"
        run: |
          cp cdk.context.json.example cdk.context.json
          uv run cdk synth --context senderEmail=ci@example.com
